<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usability Tracker</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head><body>
  <header><span class="mark">u</span><div><strong>Usability Tracker</strong><small>Opt-in website tracking</small></div></header>
  <main><div class="status"><span id="indicator"></span><div><small>Current website</small><strong id="site">Checking…</strong></div></div><p id="message" role="status"></p><button id="toggle" type="button" disabled>Enable on this site</button><div class="links"><button id="dashboard" class="secondary" type="button">Open dashboard</button><button id="options" class="secondary" type="button">Settings</button></div></main>
  <footer>Only websites you enable are tracked.</footer>
</body></html>
